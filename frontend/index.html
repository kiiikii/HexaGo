<!doctype html>
<html lang="en" ng-app="hexagoApp">
  <head>
    <meta charset="UTF-8" />
    <title>Hexago Chat</title>
    <!-- Import AngularJS -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <!-- Import our logic -->
    <script src="app.js"></script>
  </head>
  <body ng-controller="MainController">
    <!-- If Angular works, this will render the text from app.js -->
    <h1>{{ title }}</h1>

    <!-- Show this if NOT logged in -->
    <div ng-hide="isLoggedIn">
      <h2>Login to Hexago</h2>
      <form ng-submit="login()">
        <input type="email" ng-model="email" placeholder="Email" required /><br />
        <input type="password" ng-model="password" placeholder="Password" required /><br />
        <button type="submit">Login</button>
      </form>
      <p style="color: red">{{ errorMessage }}</p>
    </div>

    <!-- Show this IF logged in -->
    <div ng-show="isLoggedIn">
      <h2>Hexago Live Chat Room</h2>

      <!-- Message Feed Box -->
      <div
        style="
          border: 1px solid #ccc;
          height: 300px;
          overflow-y: scroll;
          padding: 10px;
          margin-bottom: 10px;
          background: #f9f9f9;
        "
      >
        <div ng-repeat="msg in messages" style="margin-bottom: 8px">
          <strong>{{ msg.user.username || 'Captain' }}:</strong> {{ msg.content }}
        </div>
      </div>

      <!-- Send Message Form -->
      <form ng-submit="sendMessage()">
        <input
          type="text"
          ng-model="messageContent"
          placeholder="Type a message..."
          style="width: 300px; padding: 5px"
          required
        />
        <button type="submit" style="padding: 5px 15px">Send</button>
      </form>
    </div>
  </body>
</html>
